[package]
name = "just-translator"
version = "0.2.1"
description = "JustTranslator - a cross-platform translator"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "just_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
keyring = { version = "3.6", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
tauri-plugin-opener = "2"
